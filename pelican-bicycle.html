<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{
    --coral:#FF6F61;
    --sunny:#FFC93C;
    --teal:#2EC4B6;
    --ink:#1B2A4A;
    --cream:#FFF6E5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;padding:24px;
    background:radial-gradient(circle at 50% -10%,#FFFCF5 0%,#FFE9CF 45%,#FFD3A9 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  }
  .stage{
    width:min(96vw,1040px,140vh);aspect-ratio:3/2;position:relative;
    border-radius:26px;overflow:hidden;background:var(--cream);
    box-shadow:0 30px 70px -22px rgba(27,42,74,.45),0 8px 22px -10px rgba(27,42,74,.28);
  }
  svg{display:block;width:100%;height:100%}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes crawl{from{transform:translateX(0)}to{transform:translateX(var(--step,-900px))}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes wingflap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4.5deg)}}
  @keyframes tails{
    0%,100%{transform:rotate(0deg)}
    50%{transform:rotate(5deg)}
  }
  @keyframes sunpulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  @keyframes petal{
    0%{transform:translate(0,0) rotate(0deg);opacity:0}
    12%{opacity:.95}
    88%{opacity:.95}
    100%{transform:translate(-560px,270px) rotate(560deg);opacity:0}
  }
  @keyframes headnudge{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}

  .crawl{animation-name:crawl;animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
  .spin{transform-box:view-box;animation-name:spin;animation-timing-function:linear;animation-iteration-count:infinite}
  .bob{animation:bob .6s ease-in-out infinite}
  .wing{transform-box:view-box;transform-origin:400px 206px;animation:wingflap 1.2s ease-in-out infinite}
  .tails{transform-box:view-box;transform-origin:350px 250px;animation:tails 1.6s ease-in-out infinite}
  .sunhalo{transform-box:view-box;transform-origin:762px 108px;animation:sunpulse 4.5s ease-in-out infinite}
  .head{transform-box:view-box;transform-origin:490px 175px;animation:headnudge 1.2s ease-in-out infinite}
  .petal{animation-name:petal;animation-timing-function:linear;animation-iteration-count:infinite}

  @media (max-width:560px){
    body{padding:10px}
    .stage{border-radius:16px}
  }

  @media (prefers-reduced-motion: reduce){
    .crawl,.spin,.bob,.wing,.tails,.sunhalo,.head,.petal{animation:none}
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车向前行进的 2D 动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3E8"/>

      <stop offset=".7" stop-color="#FFE7B0"/>
      <stop offset="1" stop-color="#FFD79A"/>
    </linearGradient>
    <radialGradient id="halo">

  <!-- 路边灌木（中景） -->

          <line x1="600" y1="400" x2="556.2" y2="356.2"/>
          <line x1="600" y1="400" x2="540" y2="400"/>

        <circle cx="452" cy="406" r="32" fill="#DCE6EF" stroke="#2B3A55" stroke-width="5"/>
        <g class="spin" style="transform-origin:452px 406px;animation-duration:1.2s">

        <rect id="pedalFar" x="434" y="375" width="36" height="9" rx="4" fill="#243247"/>
        <line id="thighFar" x1="374" y1="286" x2="416" y2="358" stroke="#C97A33" stroke-width="21" stroke-linecap="round"/>
        <line id="shinFar" x1="416" y1="358" x2="452" y2="379" stroke="#C97A33" stroke-width="16" stroke-linecap="round"/>
        <path id="footFar" transform="translate(452,379)" d="M -8 -12 L -8 8 L 26 4 L 20 -8 Z" fill="#C97A33" stroke="#1B2A4A" stroke-width="4" stroke-linejoin="round"/>
      </g>

      <!-- 车架 -->
      <g stroke="#2EC4B6" stroke-width="12" stroke-linecap="round" fill="none">
        <line x1="452" y1="406" x2="332" y2="400"/>
        <line x1="392" y1="290" x2="332" y2="400"/>
        <line x1="452" y1="406" x2="392" y2="290"/>
        <line x1="452" y1="406" x2="572" y2="288"/>

        <rect id="pedalNear" x="434" y="429" width="36" height="9" rx="4" fill="#1B2A4A"/>

  <!-- 花瓣 / 飞舞的小叶子 -->

    <ellipse class="petal" style="animation-duration:5.5s;animation-delay:0s" cx="860" cy="90" rx="11" ry="6" fill="#FF6F61" opacity="0"/>
    <ellipse class="petal" style="animation-duration:6.4s;animation-delay:1.6s" cx="790" cy="160" rx="9" ry="5" fill="#2EC4B6" opacity="0"/>
    <ellipse class="petal" style="animation-duration:7.2s;animation-delay:3.1s" cx="880" cy="240" rx="10" ry="6" fill="#FFC93C" opacity="0"/>
    <ellipse class="petal" style="animation-duration:6s;animation-delay:2.4s" cx="700" cy="60" rx="8" ry="5" fill="#FF6F61" opacity="0"/>

</svg>
</div>

<script>
(function(){
  var BB = {x:452, y:406};
  var CRANK_R = 27;
  var PERIOD = 1.2;               // 曲柄一圈 1.2 秒

  var legs = [
    {key:'Far',  hip:{x:374, y:286}, L1:94, L2:90, phase:Math.PI},
    {key:'Near', hip:{x:400, y:282}, L1:94, L2:90, phase:0}
  ];

  legs.forEach(function(l){
    l.el = {
      thigh: document.getElementById('thigh' + l.key),
      shin:  document.getElementById('shin'  + l.key),
      foot:  document.getElementById('foot'  + l.key),
      crank: document.getElementById('crank' + l.key),
      pedal: document.getElementById('pedal' + l.key)
    };
  });

  // 两连杆反向运动学：已知髋、脚，求膝盖
  function solveKnee(H, F, L1, L2){
    var dx = F.x - H.x, dy = F.y - H.y;
    var raw = Math.hypot(dx, dy) || 1;
    var ux = dx / raw, uy = dy / raw;
    var d = Math.min(Math.max(raw, Math.abs(L1 - L2) + 0.5), L1 + L2 - 0.5);
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var px = H.x + ux * a, py = H.y + uy * a;
    var nx = uy, ny = -ux;
    var k1 = {x: px + nx * h, y: py + ny * h};
    var k2 = {x: px - nx * h, y: py - ny * h};
    return k1.x > k2.x ? k1 : k2;   // 膝盖朝前
  }

  function setLine(el, x1, y1, x2, y2){
    el.setAttribute('x1', x1.toFixed(2));
    el.setAttribute('y1', y1.toFixed(2));
    el.setAttribute('x2', x2.toFixed(2));
    el.setAttribute('y2', y2.toFixed(2));
  }

  function update(angle){
    legs.forEach(function(l){
      var a  = angle + l.phase;
      var fx = BB.x + CRANK_R * Math.cos(a);
      var fy = BB.y + CRANK_R * Math.sin(a);
      var k  = solveKnee(l.hip, {x:fx, y:fy}, l.L1, l.L2);
      var e  = l.el;

      setLine(e.thigh, l.hip.x, l.hip.y, k.x, k.y);
      setLine(e.shin,  k.x, k.y, fx, fy);
      setLine(e.crank, BB.x, BB.y, fx, fy);

      e.pedal.setAttribute('x', (fx - 18).toFixed(2));
      e.pedal.setAttribute('y', (fy - 4.5).toFixed(2));
      e.foot.setAttribute('transform', 'translate(' + fx.toFixed(2) + ',' + fy.toFixed(2) + ')');
    });
  }

  var start = null;
  function frame(t){
    if (start === null) start = t;
    var sec = (t - start) / 1000;
    update(sec * (Math.PI * 2 / PERIOD));
    requestAnimationFrame(frame);
  }

  update(0.9);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
